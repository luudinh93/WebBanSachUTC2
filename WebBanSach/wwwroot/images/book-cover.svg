<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-labelledby="cover-title">
  <title id="cover-title">Bìa sách Nhà Giả Kim – Paulo Coelho (bìa tím đêm, họa tiết vàng – bản minh họa)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D1856"/>
      <stop offset=".55" stop-color="#21123D"/>
      <stop offset="1" stop-color="#150A29"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".55">
      <stop offset="0" stop-color="#F3D9A5" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#D8AD61" stop-opacity=".06"/>
      <stop offset="1" stop-color="#D8AD61" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E3B5"/>
      <stop offset=".5" stop-color="#D8AD61"/>
      <stop offset="1" stop-color="#B98A43"/>
    </linearGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2266"/>
      <stop offset="1" stop-color="#1A0D33"/>
    </linearGradient>
    <line id="ray-long" x1="200" y1="182" x2="200" y2="150" stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round"/>
    <line id="ray-short" x1="200" y1="186" x2="200" y2="168" stroke="#D8AD61" stroke-width="1" stroke-linecap="round" stroke-opacity=".8"/>
    <path id="sparkle" d="M0 -7 L1.4 -1.4 L7 0 L1.4 1.4 L0 7 L-1.4 1.4 L-7 0 L-1.4 -1.4 Z" fill="#F3D9A5"/>
  </defs>

  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>

  <!-- Khung viền vàng -->
  <rect x="16" y="16" width="368" height="568" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="24" y="24" width="352" height="552" fill="none" stroke="#D8AD61" stroke-opacity=".45" stroke-width=".75"/>
  <g fill="#D8AD61">
    <path d="M20 10 L26 16 L20 22 L14 16 Z"/>
    <path d="M380 10 L386 16 L380 22 L374 16 Z"/>
    <path d="M20 578 L26 584 L20 590 L14 584 Z"/>
    <path d="M380 578 L386 584 L380 590 L374 584 Z"/>
  </g>

  <!-- Bầu trời sao -->
  <g fill="#F3D9A5">
    <circle cx="62" cy="128" r="1.4" opacity=".8"/>
    <circle cx="96" cy="176" r="1" opacity=".6"/>
    <circle cx="330" cy="120" r="1.4" opacity=".8"/>
    <circle cx="300" cy="190" r="1" opacity=".6"/>
    <circle cx="350" cy="238" r="1.2" opacity=".7"/>
    <circle cx="52" cy="250" r="1.1" opacity=".6"/>
    <circle cx="120" cy="110" r=".9" opacity=".5"/>
    <circle cx="276" cy="104" r=".9" opacity=".5"/>
  </g>
  <use href="#sparkle" transform="translate(84 148) scale(.9)"/>
  <use href="#sparkle" transform="translate(322 160) scale(1.1)"/>
  <use href="#sparkle" transform="translate(66 300) scale(.6)" opacity=".7"/>
  <use href="#sparkle" transform="translate(344 290) scale(.6)" opacity=".7"/>
  <polyline points="62,128 84,148 96,176 52,250" fill="none" stroke="#F3D9A5" stroke-opacity=".3" stroke-width=".75"/>
  <polyline points="330,120 322,160 300,190 350,238" fill="none" stroke="#F3D9A5" stroke-opacity=".3" stroke-width=".75"/>

  <!-- Tên tác giả -->
  <text x="200" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="7" fill="#F3D9A5">PAULO COELHO</text>
  <line x1="150" y1="92" x2="250" y2="92" stroke="#D8AD61" stroke-opacity=".6" stroke-width=".75"/>

  <!-- Mặt trời giả kim -->
  <g>
    <use href="#ray-long"/>
    <use href="#ray-short" transform="rotate(15 200 230)"/>
    <use href="#ray-long" transform="rotate(30 200 230)"/>
    <use href="#ray-short" transform="rotate(45 200 230)"/>
    <use href="#ray-long" transform="rotate(60 200 230)"/>
    <use href="#ray-short" transform="rotate(75 200 230)"/>
    <use href="#ray-long" transform="rotate(90 200 230)"/>
    <use href="#ray-short" transform="rotate(105 200 230)"/>
    <use href="#ray-long" transform="rotate(120 200 230)"/>
    <use href="#ray-short" transform="rotate(135 200 230)"/>
    <use href="#ray-long" transform="rotate(150 200 230)"/>
    <use href="#ray-short" transform="rotate(165 200 230)"/>
    <use href="#ray-long" transform="rotate(180 200 230)"/>
    <use href="#ray-short" transform="rotate(195 200 230)"/>
    <use href="#ray-long" transform="rotate(210 200 230)"/>
    <use href="#ray-short" transform="rotate(225 200 230)"/>
    <use href="#ray-long" transform="rotate(240 200 230)"/>
    <use href="#ray-short" transform="rotate(255 200 230)"/>
    <use href="#ray-long" transform="rotate(270 200 230)"/>
    <use href="#ray-short" transform="rotate(285 200 230)"/>
    <use href="#ray-long" transform="rotate(300 200 230)"/>
    <use href="#ray-short" transform="rotate(315 200 230)"/>
    <use href="#ray-long" transform="rotate(330 200 230)"/>
    <use href="#ray-short" transform="rotate(345 200 230)"/>
  </g>
  <circle cx="200" cy="230" r="40" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <circle cx="200" cy="230" r="30" fill="url(#gold)" opacity=".9"/>
  <circle cx="200" cy="230" r="30" fill="none" stroke="#21123D" stroke-opacity=".35" stroke-width="1"/>
  <!-- Biểu tượng giả kim trong mặt trời -->
  <g fill="none" stroke="#21123D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 212 L216 240 L184 240 Z"/>
    <circle cx="200" cy="231" r="5"/>
  </g>

  <!-- Kim tự tháp xa xa -->
  <g fill="none" stroke="#D8AD61" stroke-width="1" stroke-linejoin="round">
    <path d="M110 372 L150 322 L190 372" stroke-opacity=".75"/>
    <path d="M150 322 L158 372" stroke-opacity=".45"/>
    <path d="M176 372 L204 338 L232 372" stroke-opacity=".6"/>
    <path d="M204 338 L210 372" stroke-opacity=".35"/>
  </g>

  <!-- Đồi cát -->
  <path d="M0 380 C80 340 150 400 230 372 C300 348 350 360 400 344 L400 600 L0 600 Z" fill="url(#dune)"/>
  <path d="M0 380 C80 340 150 400 230 372 C300 348 350 360 400 344" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
  <path d="M0 420 C90 400 160 432 250 412 C320 396 360 410 400 402" fill="none" stroke="#D8AD61" stroke-opacity=".45" stroke-width=".8"/>

  <!-- Người lữ hành & lạc đà -->
  <g fill="#D8AD61" opacity=".9" transform="translate(286 344)">
    <path d="M0 14 C2 6 8 4 12 8 C14 2 20 2 22 8 L26 6 L28 8 L25 12 L24 18 L22 18 L22 13 L13 14 L12 18 L10 18 L10 14 L4 14 L3 18 L1 18 Z"/>
    <circle cx="-8" cy="4" r="1.6"/>
    <path d="M-9.5 6 L-6.5 6 L-6 16 L-7 16 L-8 11 L-9 16 L-10 16 Z"/>
  </g>

  <!-- Tựa sách -->
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="2" fill="url(#gold)">NHÀ GIẢ KIM</text>
  <text x="200" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="6" fill="#F3D9A5" fill-opacity=".85">THE ALCHEMIST</text>
  <g fill="#D8AD61">
    <path d="M200 528 L204 532 L200 536 L196 532 Z"/>
    <rect x="140" y="531.5" width="48" height="1"/>
    <rect x="212" y="531.5" width="48" height="1"/>
  </g>
  <text x="200" y="558" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#F3D9A5" fill-opacity=".7">TIỂU THUYẾT</text>
</svg>
