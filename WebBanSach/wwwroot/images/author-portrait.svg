<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="author-ph-title">
  <title id="author-ph-title">Ảnh minh họa vị trí chân dung tác giả Paulo Coelho – thay bằng ảnh có giấy phép</title>
  <defs>
